name: fraimwork

# Ports bind to BIND_IP (Tailscale IP in VPN mode) or PRIVATE_BIND_IP (127.0.0.1 in
# public mode), so Docker never opens a port on the public interface by accident.
# install.sh sets both.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-workspace-env: &workspace-env
  TZ: ${TZ:-Europe/Amsterdam}
  FRAIM_MODULES: ${COMPOSE_PROFILES:-}
  FRAIM_HOSTNAME: ${FRAIM_HOSTNAME:-fraim}
  FRAIM_GATEWAY_URL: http://whatsapp:8080
  FRAIM_GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
  WHATSAPP_OWNER: ${WHATSAPP_OWNER:-}
  BROWSER_CDP_URL: http://172.30.0.10:9223
  FRAIM_BROWSER_VIEW_URL: ${BROWSER_VIEW_URL:-http://localhost:6080/vnc.html}

services:
  workspace:
    <<: *defaults
    build: ./workspace
    image: fraimwork/workspace:local
    hostname: fraim
    environment: *workspace-env
    ports:
      - "${BIND_IP:?run install.sh first}:${SSH_PORT:-2222}:22"
      - "${BIND_IP}:60000-60010:60000-60010/udp"
    volumes:
      - home:/home/claude
      - files:/home/claude/fraim
      - pc:/home/claude/pc:ro
      - ssh-host-keys:/etc/ssh/keys
      - ./config/authorized_keys:/etc/fraim/authorized_keys:ro
    networks: [fraim]

  scheduler:
    <<: *defaults
    image: fraimwork/workspace:local
    profiles: [scheduler]
    command: ["scheduler"]
    depends_on: [workspace]
    environment: *workspace-env
    volumes:
      - home:/home/claude
      - files:/home/claude/fraim
      - pc:/home/claude/pc:ro
    networks: [fraim]

  browser:
    <<: *defaults
    build: ./browser
    image: fraimwork/browser:local
    profiles: [browser]
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      TZ: ${TZ:-Europe/Amsterdam}
    shm_size: 1gb
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:6080:6080"
    volumes:
      - browser-profile:/data
      - files:/fraim
    networks:
      fraim:
        ipv4_address: 172.30.0.10

  whatsapp:
    <<: *defaults
    build: ./whatsapp
    image: fraimwork/whatsapp:local
    profiles: [whatsapp]
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      WHATSAPP_OWNER: ${WHATSAPP_OWNER:-}
      WHATSAPP_ALLOW: ${WHATSAPP_ALLOW:-}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - whatsapp-auth:/data
      - files:/fraim
      - pc:/pc:ro
    networks: [fraim]

  syncthing:
    <<: *defaults
    image: syncthing/syncthing:2.1.7
    profiles: [sync]
    hostname: ${FRAIM_HOSTNAME:-fraim}
    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: 0.0.0.0:8384
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:8384:8384"
      - "${BIND_IP}:22000:22000/tcp"
      - "${BIND_IP}:22000:22000/udp"
    volumes:
      - syncthing-config:/var/syncthing
      - files:/var/syncthing/fraim
      - pc:/var/syncthing/pc
    networks: [fraim]

networks:
  fraim:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  home:
  files:
  pc:
  ssh-host-keys:
  browser-profile:
  whatsapp-auth:
  syncthing-config:
