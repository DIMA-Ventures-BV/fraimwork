name: fraimwork

# Ports bind to BIND_IP (Tailscale IP in VPN mode) or PRIVATE_BIND_IP (127.0.0.1 in
# public mode), so Docker never opens a port on the public interface by accident.
# install.sh sets both.
#
# Isolation: the browser and the WhatsApp gateway handle untrusted input (web pages,
# messages from anyone). They only get their own drop folder (downloads, inbox), never
# the rest of ~/fraim, and each sits on its own network with the workspace, so neither
# can reach the other.
#
# Spaces: every space (work, personal, ...) is this same file started as its own compose
# project (fraimwork-NAME, env file .env.space-NAME), so it gets its own containers,
# volumes, networks and secrets. The first space keeps the project name fraimwork.
#
# Secrets: API keys live only in the secrets container (secrets-store volume). Claude's
# workspace calls http://secrets:8080/NAME/... with a session token, and the proxy swaps in
# the real key. Only the workspace and scheduler share the internal `secrets` network with
# it, so the browser (any web page) and the WhatsApp gateway cannot reach it.

x-defaults: &defaults
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-workspace-env: &workspace-env
  TZ: ${TZ:-Europe/Amsterdam}
  FRAIM_MODULES: ${COMPOSE_PROFILES:-}
  FRAIM_HOSTNAME: ${FRAIM_HOSTNAME:-fraim}
  FRAIM_GATEWAY_URL: http://whatsapp:8080
  FRAIM_GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
  FRAIM_CHANNEL_URL: ${CHANNEL_URL:-}
  FRAIM_CHANNEL_TOKEN: ${CHANNEL_TOKEN:-}
  FRAIM_REPLY_TOKEN: ${REPLY_TOKEN:-}
  WHATSAPP_OWNER: ${WHATSAPP_OWNER:-}
  BROWSER_CDP_URL: http://${BROWSER_IP:-172.30.0.10}:9223
  FRAIM_BROWSER_VIEW_URL: ${BROWSER_VIEW_URL:-http://localhost:6080/vnc.html}
  FRAIM_AUTO_CONFIRM_CHANNEL: ${AUTO_CONFIRM_CHANNEL:-1}
  FRAIM_PERMISSIONS: ${PERMISSIONS:-all}
  FRAIM_TOOL_LISTS: ${TOOL_LISTS:-enforce}
  FRAIM_VERSION: ${FRAIM_VERSION:-dev}
  FRAIM_RELEASES_REPO: ${FRAIM_RELEASES_REPO:-DIMA-Ventures-BV/fraimwork}
  FRAIM_AUTO_UPDATE: ${AUTO_UPDATE:-on}
  FRAIM_SECRETS_URL: http://secrets:8080
  FRAIM_SECRETS_TOKEN: ${SECRETS_TOKEN:-}
  FRAIM_SPACE: ${FRAIM_SPACE:-main}
  FRAIM_ACCESS_MODE: ${ACCESS_MODE:-}
  FRAIM_PREVIEW_PORTS: ${PREVIEW_PORTS:-3100-3109}
  FRAIM_PREVIEW_HOST: ${PREVIEW_HOST:-}
  FRAIM_MCP_DENY: ${MCP_DENY:-}
  FRAIM_CLAUDEAI_CONNECTORS: ${CLAUDEAI_CONNECTORS:-on}

x-workspace-volumes: &workspace-volumes
  - home:/home/claude
  - files:/home/claude/fraim
  - downloads:/home/claude/fraim/downloads
  - inbox:/home/claude/fraim/inbox
  - pc:/home/claude/pc:ro
  - ./bin/fraim-config:/usr/local/bin/fraim-config:ro
  - ./config/claude-template:/opt/fraim/claude-template:ro
  - ./server-plugin:/opt/fraim/server-plugin:ro
  - ./modules:/etc/fraim/modules:ro

services:
  workspace:
    <<: *defaults
    build:
      context: ./workspace
      args:
        VOICE: ${VOICE:-on}
    image: fraimwork/workspace:${FRAIM_IMAGE_TAG:-local}
    hostname: fraim
    environment: *workspace-env
    # A cap from this server's own RAM (install.sh sets it): a runaway Claude is stopped
    # inside the container instead of swapping the whole server until SSH stops answering.
    mem_limit: ${FRAIM_WORKSPACE_MEM:-64g}
    memswap_limit: ${FRAIM_WORKSPACE_MEM:-64g}
    ports:
      - "${BIND_IP:?run install.sh first}:${SSH_PORT:-2222}:22"
      # Same range on both sides: mosh-server binds the port the client asks for.
      - "${BIND_IP}:${MOSH_PORTS:-60000-60010}:${MOSH_PORTS:-60000-60010}/udp"
      # Previews of dev servers (fraim-preview): tailnet only in tailscale mode, 127.0.0.1 in public mode.
      - "${PRIVATE_BIND_IP:-127.0.0.1}:${PREVIEW_PORTS:-3100-3109}:3100-3109"
    volumes:
      - home:/home/claude
      - files:/home/claude/fraim
      - downloads:/home/claude/fraim/downloads
      - inbox:/home/claude/fraim/inbox
      - pc:/home/claude/pc:ro
      - ./bin/fraim-config:/usr/local/bin/fraim-config:ro
      - ./config/claude-template:/opt/fraim/claude-template:ro
      - ./server-plugin:/opt/fraim/server-plugin:ro
      - ./docs:/etc/fraim/docs:ro
      - ./modules:/etc/fraim/modules:ro
      - ssh-host-keys:/etc/ssh/keys
      - ./config/authorized_keys:/etc/fraim/authorized_keys:ro
    networks: [fraim, wa, sync, secrets]

  scheduler:
    <<: *defaults
    image: fraimwork/workspace:${FRAIM_IMAGE_TAG:-local}
    profiles: [scheduler]
    command: ["scheduler"]
    mem_limit: ${FRAIM_SCHEDULER_MEM:-64g}
    memswap_limit: ${FRAIM_SCHEDULER_MEM:-64g}
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on: [workspace]
    environment: *workspace-env
    volumes: *workspace-volumes
    networks: [fraim, wa, sync, secrets]

  browser:
    <<: *defaults
    build: ./browser
    image: fraimwork/browser:${FRAIM_IMAGE_TAG:-local}
    profiles: [browser]
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      TZ: ${TZ:-Europe/Amsterdam}
    shm_size: 1gb
    # A runaway tab kills only Chromium (it restarts on its own), not Claude's workspace.
    mem_limit: 1536m
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:${VNC_PORT:-6080}:6080"
    volumes:
      - browser-profile:/data
      - downloads:/fraim/downloads
    networks:
      fraim:
        ipv4_address: ${BROWSER_IP:-172.30.0.10}

  whatsapp:
    <<: *defaults
    build: ./whatsapp
    image: fraimwork/whatsapp:${FRAIM_IMAGE_TAG:-local}
    profiles: [whatsapp]
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      WHATSAPP_OWNER: ${WHATSAPP_OWNER:-}
      WHATSAPP_ALLOW: ${WHATSAPP_ALLOW:-}
      WHATSAPP_CONTACTS: ${WHATSAPP_CONTACTS:-}
      REPLY_TOKEN: ${REPLY_TOKEN:-}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - whatsapp-auth:/data
      - files:/fraim:ro
      - inbox:/inbox
      - downloads:/downloads:ro
      - pc:/pc:ro
    networks: [wa]

  secrets:
    <<: *defaults
    build: ./secrets
    image: fraimwork/secrets:${FRAIM_IMAGE_TAG:-local}
    environment:
      SECRETS_TOKEN: ${SECRETS_TOKEN:-}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - secrets-store:/data/secrets
    networks: [secrets, secrets-out]

  # Gmail, Drive and Calendar as an MCP server for any agent (Claude, Codex). The Google
  # tokens stay in google-store; the workspace reaches it at http://google:8000/mcp.
  google:
    <<: *defaults
    build: ./google
    image: fraimwork/google:${FRAIM_IMAGE_TAG:-local}
    profiles: [google]
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      GOOGLE_PERMISSIONS: ${GOOGLE_PERMISSIONS:-gmail:drafts drive:readonly calendar:readonly}
      WORKSPACE_MCP_ALLOWED_HOSTS: google
      REPLY_TOKEN: ${REPLY_TOKEN:-}
    volumes:
      - google-store:/data/google
    networks: [secrets, secrets-out]

  syncthing:
    <<: *defaults
    image: syncthing/syncthing:2.1.7
    profiles: [sync]
    hostname: ${SYNC_DEVICE_NAME:-${FRAIM_HOSTNAME:-fraim}}
    environment:
      PUID: "1000"
      PGID: "1000"
      STGUIADDRESS: 0.0.0.0:8384
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "${PRIVATE_BIND_IP:-127.0.0.1}:${SYNC_GUI_PORT:-8384}:8384"
      - "${BIND_IP}:${SYNC_PORT:-22000}:22000/tcp"
      - "${BIND_IP}:${SYNC_PORT:-22000}:22000/udp"
    volumes:
      - syncthing-config:/var/syncthing
      - files:/var/syncthing/fraim
      - downloads:/var/syncthing/fraim/downloads
      - inbox:/var/syncthing/fraim/inbox
      - pc:/var/syncthing/pc
    networks: [sync]

networks:
  # workspace + scheduler + browser (the browser has a fixed IP: Chrome DevTools
  # rejects host names in the Host header)
  fraim:
    ipam:
      config:
        - subnet: ${FRAIM_SUBNET:-172.30.0.0/24}
  # workspace + scheduler + WhatsApp gateway
  wa:
    ipam:
      config:
        - subnet: ${FRAIM_SUBNET_WA:-172.31.0.0/24}
  # workspace + scheduler + Syncthing
  sync:
    ipam:
      config:
        - subnet: ${FRAIM_SUBNET_SYNC:-172.31.128.0/24}
  # workspace + scheduler + secrets proxy. Internal: no route to the internet.
  secrets:
    internal: true
    ipam:
      config:
        - subnet: ${FRAIM_SUBNET_SECRETS:-172.31.64.0/24}
  # the secrets proxy's own way out to the APIs it forwards to
  secrets-out:
    ipam:
      config:
        - subnet: ${FRAIM_SUBNET_SECRETS_OUT:-172.31.192.0/24}

volumes:
  home:
  files:
  downloads:
  inbox:
  pc:
  ssh-host-keys:
  browser-profile:
  whatsapp-auth:
  syncthing-config:
  secrets-store:
  google-store:
