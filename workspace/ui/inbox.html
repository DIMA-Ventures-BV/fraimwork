<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fraim queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='15' width='12' height='3' rx='1.5' fill='%23fff' opacity='.8'/%3E%3Crect x='8' y='21' width='8' height='3' rx='1.5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; --bg:#141517; --deep:#101113; --hover:#1d1e22; --sel:#24262c; --ink:#ececee; --soft:#c4c6cb; --muted:#8b8f98; --line:#26272b; --line2:#33353b; --accent:#6f7bf0; --green:#4cc38a; --yellow:#e2b33c; --red:#f2555a; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
button, textarea { font:inherit; color:inherit; }
a { color:var(--accent); }
.app { display:grid; grid-template-columns:330px minmax(0,1fr) 390px; height:100vh; }
.pane { display:flex; flex-direction:column; min-height:0; min-width:0; }
.scroll { flex:1; overflow-y:auto; min-height:0; }
.list { border-right:1px solid var(--line); background:var(--deep); }
.lh { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; }
.lh h1 { font-size:16px; font-weight:600; margin:0; }
.lh a { color:var(--muted); font-size:13px; text-decoration:none; font-weight:500; }
.lh a:hover { color:var(--ink); }
.tabs { display:flex; gap:2px; padding:0 10px 10px; border-bottom:1px solid var(--line); }
.tabs button { border:0; background:none; color:var(--muted); padding:3px 8px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
.tabs button.on { background:var(--sel); color:var(--ink); }
.msg { display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 14px; cursor:pointer; }
.msg:hover { background:var(--hover); } .msg.on { background:var(--sel); }
.av { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; color:#fff; background:var(--c,#555); flex:none; }
.top { display:flex; justify-content:space-between; gap:8px; }
.from, .subj, .snip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.from, .subj { color:var(--soft); } .snip { display:block; color:var(--muted); font-size:13px; }
.time { color:var(--muted); font-size:12px; flex:none; }
.unread .from, .unread .subj { color:var(--ink); font-weight:600; }
.tag { font-size:11px; font-weight:500; flex:none; } .need { color:var(--yellow); } .work { color:var(--green); } .new { color:var(--accent); }
.none { padding:40px 20px; text-align:center; color:var(--muted); }
.body { padding:24px 32px 40px; max-width:820px; }
.body h2 { margin:0 0 16px; font-size:21px; line-height:1.3; font-weight:600; overflow-wrap:anywhere; }
.who { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:center; margin-bottom:16px; }
.who .av { width:40px; height:40px; }
.who b { font-weight:600; } .who small { color:var(--muted); font-size:13px; }
.who .d { color:var(--muted); font-size:13px; white-space:nowrap; }
.text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; line-height:1.6; }
.fwd { color:var(--muted); font-size:13px; border-left:2px solid var(--line2); padding:2px 0 2px 10px; margin-bottom:14px; white-space:pre-wrap; }
.mail { border-bottom:1px solid var(--line); padding:14px 0; }
.mail:last-child { border-bottom:0; }
.fold { display:grid; grid-template-columns:32px 150px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:9px 0; cursor:pointer; color:var(--soft); }
.fold:hover { background:var(--hover); }
.fold .sn { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fold b { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fold small { color:var(--muted); font-size:12px; white-space:nowrap; }
.more { display:block; width:100%; text-align:center; background:none; border:0; border-bottom:1px solid var(--line); color:var(--accent); padding:8px; cursor:pointer; font-size:13px; font-weight:500; }
.link { background:none; border:0; padding:0; color:var(--muted); font-size:13px; cursor:pointer; margin:12px 12px 0 0; text-decoration:underline; text-underline-offset:2px; }
.quoted { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); font-size:13.5px; border-left:2px solid var(--line2); padding-left:12px; margin-top:12px; }
.sheet { display:block; width:100%; height:300px; border:0; border-radius:8px; background:#fff; }
.files { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.file { border:1px solid var(--line2); border-radius:8px; padding:6px 12px; color:var(--soft); font-size:13px; overflow-wrap:anywhere; }
.file small { color:var(--muted); margin-left:6px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
.chip { border:1px solid var(--line2); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--soft); }
.chip b { font-weight:500; color:var(--muted); margin-right:4px; }
.cm { border-top:1px solid var(--line); padding-top:12px; margin-top:14px; color:var(--soft); white-space:pre-wrap; overflow-wrap:anywhere; }
.cm b { color:var(--ink); font-weight:600; } .cm small { color:var(--muted); margin-left:6px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
.stat { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
.stat b { display:block; font-size:20px; font-weight:600; } .stat span { color:var(--muted); font-size:12px; }
.tech { margin-top:18px; color:var(--muted); font-size:13px; }
.tech summary { cursor:pointer; }
.tech pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.5 ui-monospace, Menlo, monospace; }
.shot { display:block; max-width:100%; border-radius:8px; border:1px solid var(--line); margin-top:14px; }
.agents { border-left:1px solid var(--line); background:var(--deep); }
.ah { padding:14px 16px; border-bottom:1px solid var(--line); }
.ah b { font-weight:600; } .ah div { color:var(--muted); font-size:13px; }
.chat { padding:14px 16px; }
.c { display:grid; grid-template-columns:30px minmax(0,1fr); gap:9px; margin-bottom:14px; }
.c .av { width:30px; height:30px; font-size:11px; }
.c .n { font-weight:600; font-size:13px; } .c .n small { font-weight:400; color:var(--muted); font-size:12px; margin-left:5px; }
.c .b { color:var(--soft); font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere; }
.ask { border:1px solid color-mix(in srgb, var(--yellow) 50%, var(--line)); border-radius:8px; padding:9px 11px; margin-top:5px; font-size:13.5px; }
.ask.closed { border-color:var(--line); color:var(--soft); }
.nr { float:right; background:none; border:1px solid var(--line2); border-radius:6px; color:var(--muted); font-size:12px; font-weight:500; padding:3px 9px; cursor:pointer; }
.nr:hover { color:var(--ink); background:var(--hover); }
.toast button { background:none; border:0; color:var(--accent); font-weight:600; cursor:pointer; margin-left:10px; padding:0; }
.reply { margin-top:8px; }
.reply small { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
.reply .sent { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
.reply textarea { width:100%; min-height:150px; resize:vertical; background:var(--panel); color:var(--ink); border:1px solid var(--line2); border-radius:6px; padding:8px 10px; font:inherit; }
.reply .status { margin:5px 0 0; }
.reply .status.bad { color:var(--red); }
.foryou { font-size:11px; font-weight:600; color:var(--yellow); margin-bottom:3px; }
.c.side { grid-template-columns:22px minmax(0,1fr); gap:8px; margin-bottom:10px; }
.c.side .av { width:22px; height:22px; font-size:9px; }
.c.side .n { font-weight:400; font-size:12px; color:var(--muted); }
.c.side .n em { font-style:normal; font-weight:500; }
.c.side .b { color:var(--muted); font-size:13px; }
.ask p { margin:6px 0 0; color:var(--muted); font-size:12.5px; }
.acts { display:flex; gap:6px; margin-top:9px; }
.btn { height:30px; padding:0 14px; border-radius:6px; border:1px solid var(--line2); background:var(--hover); cursor:pointer; font-weight:500; font-size:13px; }
.btn.p { background:var(--accent); border-color:var(--accent); color:#fff; }
.working { position:relative; overflow:hidden; flex:none; display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:1px solid color-mix(in srgb, var(--green) 35%, var(--line)); background:color-mix(in srgb, var(--green) 14%, var(--deep)); color:var(--green); font-size:13px; font-weight:500; }
.working::before { content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 25%, color-mix(in srgb, var(--green) 30%, transparent) 50%, transparent 75%); transform:translateX(-100%); animation:sweep 2.2s ease-in-out infinite; }
.working span { position:relative; }
.working .bars { display:inline-flex; align-items:center; gap:2px; height:12px; flex:none; }
.working .bars i { width:3px; height:100%; border-radius:2px; background:var(--green); transform-origin:center; animation:bar 1s ease-in-out infinite; }
.working .bars i:nth-child(2) { animation-delay:.15s; } .working .bars i:nth-child(3) { animation-delay:.3s; }
@keyframes sweep { to { transform:translateX(100%); } }
@keyframes bar { 0%, 100% { transform:scaleY(.35); opacity:.6; } 50% { transform:scaleY(1); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .working::before { display:none; } .working .bars i { animation:none; } }
.reply { border-top:1px solid var(--line); padding:10px 12px 12px; }
.reply textarea { display:block; width:100%; background:none; border:1px solid var(--line2); border-radius:8px; padding:8px 11px; font-size:13px; resize:none; outline:none; }
.reply textarea:focus { border-color:var(--accent); }
.empty { margin:auto; color:var(--muted); padding:40px; text-align:center; }
.app.solo { grid-template-columns:330px minmax(0,1fr); grid-template-rows:none; } .app.solo .agents { display:none; }
.pin { border-bottom:1px solid var(--line2); padding:12px 14px; }
.talk { display:flex; flex-direction:column; height:100%; }
.th { display:flex; gap:10px; align-items:center; padding:12px 24px; border-bottom:1px solid var(--line); flex:none; }
.th b { font-weight:600; display:block; } .th small { color:var(--muted); font-size:13px; }
.lines { flex:1; overflow-y:auto; min-height:0; padding:20px 24px; }
.row { display:flex; margin-bottom:10px; } .row.me { justify-content:flex-end; }
.bub { max-width:600px; background:var(--sel); border-radius:12px 12px 12px 3px; padding:9px 13px; font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere; }
.me .bub { background:#3b4394; border-radius:12px 12px 3px 12px; }
.bub b { font-weight:600; }
.bub small { display:block; text-align:right; color:var(--muted); font-size:11px; margin-top:3px; } .me .bub small { color:#c3c8f5; }
.ref { display:block; width:100%; text-align:left; margin-top:7px; background:var(--bg); border:1px solid var(--line2); border-radius:8px; padding:7px 10px; cursor:pointer; white-space:normal; }
.ref:hover { background:var(--hover); }
.dots { color:var(--green); font-size:13px; padding:2px 2px 10px; }
.box { padding:12px 24px 16px; border-top:1px solid var(--line); flex:none; }
.box textarea { display:block; width:100%; background:none; border:1px solid var(--line2); border-radius:8px; padding:10px 12px; font-size:14px; resize:none; outline:none; }
.box textarea:focus { border-color:var(--accent); }
@media (max-width:700px) { .talk { height:70vh; } }
.toast { position:fixed; right:16px; bottom:16px; background:var(--sel); border:1px solid var(--line2); padding:9px 12px; border-radius:8px; display:none; z-index:5; }
@media (max-width:1050px) { .app { grid-template-columns:280px minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1fr); } .list { grid-row:1 / 3; } .agents { border-left:0; border-top:1px solid var(--line); grid-column:2; } }
@media (max-width:700px) { .app { display:block; height:auto; } .scroll { overflow:visible; } .list .scroll { max-height:40vh; overflow-y:auto; } .body { padding:18px 16px 24px; } .who { grid-template-columns:40px minmax(0,1fr); } .who .d { grid-column:2; } .fold { grid-template-columns:32px minmax(0,1fr) auto; } .fold .sn { display:none; } }
</style>
</head>
<body>
<div class="app">
  <section class="pane list"><div class="lh"><h1>Inbox</h1><span><a href="/settings" style="margin-right:12px">Settings</a><a href="/team">Team</a></span></div><div class="tabs" id="tabs"></div><div class="scroll" id="list"></div></section>
  <main class="pane"><div class="scroll" id="message"></div></main>
  <aside class="pane agents"><div id="agents" class="pane" style="flex:1"></div><div class="reply" id="reply"><textarea id="say" rows="1" placeholder="Write to the agents"></textarea></div></aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var rows = [], cur = null, tab = 'all', data = null, midKey = '', sideKey = '', listKey = '', seen = null, chief = null, chatKey = '', chiefTimer = null
var quote = {}, orig = {}, imgs = {}, opened = {}, allOlder = {}
var TABS = [['all', 'All'], ['need', 'Needs you'], ['work', 'Working'], ['done', 'Done']]
var TAG = { need: ['Needs you', 'need'], work: ['Working', 'work'], new: ['New', 'new'] }
var COLORS = ['#6f7bf0', '#a27ce8', '#2f8fb0', '#c9772e', '#3aa577', '#b0568f', '#7a8a3a', '#d9484d', '#5b8def']
function $(s) { return document.querySelector(s) }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
function links(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>' }) }
function hue(n) { var h = 0; String(n).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0 }); return COLORS[h % COLORS.length] }
function initials(n) { var p = String(n).trim().split(/\s+/); return esc(((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : (p[0] || '').charAt(1))).toUpperCase()) }
function chiefName() { return (chief && chief.title) || 'Chief of staff' }
function av(n) { return '<span class="av" style="--c:' + hue(n) + '">' + initials(n) + '</span>' }
function when(d, short) {
  var t = new Date(String(d || '').replace(' at ', ' '))
  if (isNaN(t)) return esc(d || '')
  var hm = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })
  if (t.toDateString() === new Date().toDateString()) return short ? hm : 'Today ' + hm
  var day = t.toLocaleDateString([], { day: 'numeric', month: 'short' })
  return short ? day : day + ', ' + hm
}
function toast(t) { var e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none' }, 3000) }
function shown() { return rows.filter(function (r) { return tab === 'all' ? !r.closed && !(r.kind === 'item' && r.state === 'done') : r.state === tab || (tab === 'work' && r.state === 'new') }) }
function drawList() {
  var key = JSON.stringify([rows, cur, tab, chief && chief.typing, chief && chief.messages.length]); if (key === listKey) return; listKey = key
  $('#tabs').innerHTML = TABS.map(function (x) { return '<button data-t="' + x[0] + '" class="' + (tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>' }).join('')
  var l = shown()
  $('#list').innerHTML = pinHtml() + (l.length ? l.map(function (r) {
    var g = TAG[r.state]
    return '<button class="msg' + (r.unread ? ' unread' : '') + (r.id === cur ? ' on' : '') + '" data-id="' + esc(r.id) + '">' + av(r.who) + '<span style="min-width:0"><span class="top"><span class="from">' + esc(r.who) + '</span><span class="time">' + when(r.time, true) + '</span></span><span class="top"><span class="subj">' + esc(r.title) + '</span>' + (g ? '<span class="tag ' + g[1] + '">' + g[0] + '</span>' : '') + '</span><span class="snip">' + esc(r.snippet) + '</span></span></button>'
  }).join('') : '<div class="none">Nothing here.</div>')
}
function pinHtml() {
  if (!chief || !chief.exists) return ''
  var last = chief.messages[chief.messages.length - 1]
  var snip = chief.typing ? 'Typing' : last ? (last.who === 'owner' ? 'You: ' : '') + last.text.replace(/\s+/g, ' ') : 'Ask me anything.'
  return '<button class="msg pin' + (cur === 'chief' ? ' on' : '') + '" data-id="chief">' + av(chiefName()) + '<span style="min-width:0"><span class="top"><span class="from" style="color:var(--ink);font-weight:600">' + esc(chiefName()) + '</span>' + (last ? '<span class="time">' + when(last.time.replace(' ', 'T'), true) + '</span>' : '') + '</span><span class="snip">' + esc(snip) + '</span></span></button>'
}
function spoken(t) { return links(t).replace(/(^|\s)\*(\S[^*\n]*)\*/g, '$1<b>$2</b>') }
function bubble(m) {
  var me = m.who === 'owner'
  return '<div class="row' + (me ? ' me' : '') + '"><div class="bub">' + spoken(m.text) + (m.refs || []).map(function (r) { return '<button class="ref" data-go="' + esc(r.id) + '">' + esc(r.title) + '</button>' }).join('') + '<small>' + when(m.time.replace(' ', 'T'), true) + (me && !m.app ? ', on WhatsApp' : '') + '</small></div></div>'
}
function drawChief() {
  if (!chief) return
  if (!$('#clines')) {
    chatKey = ''
    $('#message').innerHTML = '<div class="talk"><div class="th">' + av(chiefName()) + '<div><b>' + esc(chiefName()) + '</b><small>Same conversation as on WhatsApp</small></div></div><div class="lines" id="clines"></div><div class="box"><textarea id="csay" rows="1" placeholder="Message ' + esc(chiefName()) + '"></textarea></div></div>'
  }
  var key = JSON.stringify([chief.messages, chief.typing]); if (key === chatKey) return
  chatKey = key
  var box = $('#clines'), end = !box.innerHTML || box.scrollTop + box.clientHeight >= box.scrollHeight - 40
  box.innerHTML = (chief.messages.length ? chief.messages.map(bubble).join('') : '<div class="none">Ask me anything.</div>') + (chief.typing ? '<div class="dots">' + esc(chiefName()) + ' is typing</div>' : '')
  if (end) box.scrollTop = box.scrollHeight
}
async function loadChief() {
  var r = await fetch('/api/chief').catch(function () {})
  if (!r || !r.ok) return
  chief = await r.json()
  if (cur === 'chief') drawChief()
  if (chief.typing && !chiefTimer) chiefTimer = setTimeout(function () { chiefTimer = null; loadChief().then(drawList) }, 1500)
}

function page(m, i) {
  var csp = "default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data: cid:" + (imgs[i] ? ' https: http:' : '')
  var doc = '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + csp + '"><base target="_blank"><style>html,body{margin:0;background:#fff;color:#111;font:14px/1.5 sans-serif}body{padding:12px}img{max-width:100%;height:auto}</style>' + m.html
  return '<iframe class="sheet" title="The original mail" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="' + esc(doc) + '"></iframe>'
}
function mailBody(m, i) {
  var sheet = m.html && (orig[i] === undefined ? m.designed : orig[i])
  var out = sheet ? page(m, i) : '<div class="text">' + (m.text ? links(m.text) : '<span style="color:var(--muted)">There is no text in this mail.</span>') + '</div>'
  if (!sheet && m.quoted) out += quote[i] ? '<div class="quoted">' + links(m.quoted) + '</div><button class="link" data-quote="' + i + '">Hide earlier text</button>' : '<button class="link" data-quote="' + i + '">Show earlier text</button>'
  if (m.html) out += '<button class="link" data-orig="' + i + '">' + (sheet ? 'Show as plain text' : 'Show the original') + '</button>'
  if (sheet) out += '<button class="link" data-img="' + i + '">' + (imgs[i] ? 'Hide pictures' : 'Show pictures') + '</button>'
  if (m.attachments && m.attachments.length) out += '<div class="files">' + m.attachments.map(function (a) { return '<span class="file">' + esc(a.name) + '<small>' + esc(a.size) + '</small></span>' }).join('') + '</div>'
  return out
}
function mailOpen(m, i) {
  return '<div class="mail">' + (m.forwardedBy ? '<div class="fwd">Forwarded by ' + esc(m.forwardedBy) + (m.forwardNote ? ': ' + esc(m.forwardNote) : '') + '</div>' : '') +
    '<div class="who">' + av(m.from) + '<div style="min-width:0"><b>' + esc(m.from) + '</b> <small>' + esc(m.address) + '</small>' + (m.to ? '<br><small>to ' + esc(m.to.replace(/<[^>]*>/g, '').trim()) + '</small>' : '') + '</div><span class="d">' + when(m.date) + '</span></div>' + mailBody(m, i) + '</div>'
}
function drawMail(t) {
  var ms = t.messages, last = ms.length - 1, html = '<h2>' + esc(t.title) + '</h2>'
  var hide = last > 3 && !allOlder[t.id]
  ms.forEach(function (m, i) {
    if (hide && i > 0 && i < last - 1) { if (i === 1) html += '<button class="more" data-older="1">' + (last - 2) + ' earlier messages</button>'; return }
    if (i === last || opened[t.id + i]) html += (i === last ? '' : '<button class="link" data-fold="' + i + '" style="margin:10px 0 0">Fold</button>') + mailOpen(m, i)
    else html += '<button class="fold" data-fold="' + i + '">' + av(m.from) + '<b>' + esc(m.from) + '</b><span class="sn">' + esc(m.text.replace(/\s+/g, ' ')) + '</span><small>' + when(m.date) + '</small></button>'
  })
  return html
}
function chips(t) {
  var f = t.fields || {}, keys = Object.keys(f).filter(function (k) { return f[k] })
  return keys.length ? '<div class="chips">' + keys.map(function (k) { return '<span class="chip"><b>' + esc(k) + '</b>' + esc(f[k]) + '</span>' }).join('') + '</div>' : ''
}
function drawLinear(t) {
  return '<h2>' + esc(t.title) + '</h2>' + chips(t) + '<div class="who">' + av(t.who) + '<div><b>' + esc(t.who) + '</b><br><small>opened this issue</small></div><span class="d">' + when(t.created) + '</span></div><div class="text">' + links(t.text) + '</div>' +
    (t.comments || []).map(function (c) { return '<div class="cm"><b>' + esc(c.who) + '</b><small>' + when(c.time) + '</small><br>' + links(c.text) + '</div>' }).join('')
}
function drawError(t) {
  var s = t.stats || {}
  return '<h2>' + esc(t.title) + '</h2><div class="stats"><div class="stat"><b>' + esc(s.count || 1) + '</b><span>times so far</span></div><div class="stat"><b>' + when(s.first || t.created, true) + '</b><span>first time</span></div><div class="stat"><b>' + when(s.last || t.created, true) + '</b><span>last time</span></div></div>' + chips(t) + '<div class="text">' + links(t.text) + '</div>' +
    (t.details ? '<details class="tech"><summary>Technical details</summary><pre>' + esc(t.details) + '</pre></details>' : '')
}
function drawCard(t) {
  return '<h2>' + esc(t.title || '(no subject)') + '</h2>' + chips(t) + '<div class="who">' + av(t.who || '?') + '<div><b>' + esc(t.who || 'Someone') + '</b></div><span class="d">' + when(t.created) + '</span></div><div class="text">' + (t.text ? links(t.text) : '<span style="color:var(--muted)">There is no text with this.</span>') + '</div>' +
    (t.media || []).map(function (m) { var src = '/media/' + t.id + '/' + encodeURIComponent(m); return /\.(webm|mp4|mov)$/i.test(m) ? '<video class="shot" controls preload="metadata" src="' + src + '"></video>' : '<img class="shot" alt="" src="' + src + '">' }).join('') +
    ((t.links || []).length ? '<div class="files">' + t.links.map(function (u) { return '<a class="file" target="_blank" rel="noopener" href="' + esc(/^https?:/i.test(u) ? u : '#') + '">' + esc(u) + '</a>' }).join('') + '</div>' : '')
}
var LAYOUT = { email: drawMail, whatsapp: drawMail, linear: drawLinear, error: drawError }
function sizeSheets() {
  document.querySelectorAll('iframe.sheet').forEach(function (f) {
    var fit = function () { try { f.style.height = Math.max(120, f.contentDocument.documentElement.scrollHeight) + 'px' } catch (e) {} }
    f.addEventListener('load', function () { fit(); setTimeout(fit, 400) })
  })
}
function drawMiddle(force) {
  var t = data; if (!t) { $('#message').innerHTML = '<div class="none">Choose a message on the left.</div>'; return }
  var key = JSON.stringify([t.id, t.title, t.who, t.text, t.fields, t.messages, t.comments, t.stats, t.details, t.media, t.links])
  if (key === midKey && !force) return
  midKey = key
  var box = $('#message'), top = box.scrollTop, html
  try {
    var draw = t.kind === 'email' && !t.messages.length ? drawCard : (LAYOUT[t.kind] || drawCard)
    html = draw(t)
  } catch (e) { html = drawCard({ id: t.id, title: t.title, who: t.who, created: t.created, text: t.text }) }
  box.innerHTML = '<div class="body">' + html + '</div>'
  sizeSheets()
  if (force) box.scrollTop = top; else box.scrollTop = 0
}
function replyHtml(i, open) {
  var r = i.reply; if (!r) return ''
  var said = { sending: ['Sending now', ''], sent: ['Sent', ''], failed: ['Did not go out: ' + r.error, 'bad'], unknown: ['Maybe sent. Check your sent messages.', 'bad'] }[r.status]
  return '<div class="reply"><small>To ' + esc(r.name) + ', ' + esc(r.to) + (r.subject ? '<br>' + esc(r.subject) : '') + '</small>' +
    (open ? '<textarea class="draft" aria-label="The reply" data-draft="' + esc(i.id) + '">' + esc(r.text) + '</textarea>' : '<div class="sent">' + esc(r.text) + '</div>') +
    (said ? '<small class="status ' + said[1] + '">' + esc(said[0]) + '</small>' : '') + '</div>'
}
function chatHtml(c) {
  var time = when(c.time, true)
  if (c.from === 'You') return '<div class="row me"><div class="bub">' + esc(c.text) + '<small>' + time + '</small></div></div>'
  var i = c.item, open = i && i.state === 'open'
  if (!i && c.to !== 'You') return '<div class="c side">' + av(c.from) + '<div><div class="n"><em>' + esc(c.from) + '</em> to <em>' + esc(c.to || 'the team') + '</em><small>' + time + '</small></div><div class="b">' + esc(c.text) + '</div></div></div>'
  var head = '<div class="n">' + esc(c.from) + '<small>' + time + '</small></div>'
  if (!i) return '<div class="c">' + av(c.from) + '<div>' + head + '<div class="ask"><div class="foryou">For you</div>' + esc(c.text) + '</div></div></div>'
  return '<div class="c">' + av(c.from) + '<div>' + head + '<div class="ask' + (open ? '' : ' closed') + '">' + (open ? '<div class="foryou">For you</div>' : '') + esc(i.ask || i.title) + (i.need ? '<p>' + esc(i.need) + '</p>' : '') + (i.if_yes ? '<p>If yes: ' + esc(i.if_yes) + '</p>' : '') + replyHtml(i, open) +
    (open ? '<div class="acts"><button class="btn p" data-v="approved" data-item="' + esc(i.id) + '">' + (i.reply ? 'Send' : 'Yes') + '</button><button class="btn" data-v="dismissed" data-item="' + esc(i.id) + '">' + (i.reply ? 'Do not send' : 'No') + '</button></div>' : '') + '</div></div></div>'
}
function drawAgents() {
  var t = data; if (!t) { $('#agents').innerHTML = ''; return }
  var typing = document.activeElement && document.activeElement.classList.contains('draft')
  var key = JSON.stringify([t.id, t.chat, t.working, Boolean(t.closed)]); if (key === sideKey || typing) return
  var same = sideKey && JSON.parse(sideKey)[0] === t.id
  sideKey = key
  var waiting = t.chat.some(function (c) { return c.item && c.item.state === 'open' })
  var status = t.closed ? 'Closed' : waiting ? 'Needs your answer' : t.working.length ? t.working.join(', ') + (t.working.length > 1 ? ' are' : ' is') + ' working on it. Nothing needed from you.' : t.chat.length ? 'Nothing needed from you.' : 'No agent has picked this up yet'
  var old = $('#chat'), atEnd = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 30
  $('#agents').innerHTML = '<div class="ah">' + (/^t/.test(t.id) ? '<button class="nr" id="nr">' + (t.closed ? 'Put back' : 'Not relevant') + '</button>' : '') + '<b>Agents on this</b><div>' + esc(status) + '</div></div><div class="scroll" id="chat"><div class="chat">' + t.chat.map(chatHtml).join('') + '</div></div>' +
    (t.working.length ? '<div class="working" role="status"><span class="bars"><i></i><i></i><i></i></span><span>' + esc(t.working.join(', ')) + (t.working.length > 1 ? ' are' : ' is') + ' working on it</span></div>' : '')
  var box = $('#chat'); if (!same || atEnd) box.scrollTop = box.scrollHeight
  $('#reply').style.display = /^t/.test(t.id) ? '' : 'none'
}
function tellApp() {
  var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fraim
  if (!h) return
  var open = rows.filter(function (r) { return r.state === 'need' })
  var fresh = seen ? open.filter(function (r) { return !seen[r.id] }) : []
  seen = {}; open.forEach(function (r) { seen[r.id] = true })
  try { h.postMessage({ count: open.length, fresh: fresh.slice(0, 5).map(function (r) { return { id: r.id, title: r.title, body: r.snippet } }) }) } catch (e) {}
}
async function loadRows() {
  var r = await fetch('/api/threads').catch(function () {})
  if (!r) return
  if (!r.ok) { $('#message').innerHTML = '<div class="none">No access. Ask Claude for your queue link.</div>'; return }
  rows = await r.json(); tellApp()
  await loadChief()
  if (!cur && chief && chief.exists) await pick('chief', true)
  else if (cur !== 'chief' && (!cur || !rows.some(function (x) { return x.id === cur }))) { var f = shown()[0]; if (f) await pick(f.id, true) }
  drawList()
}
async function loadDetail() {
  if (!cur || cur === 'chief') return
  var id = cur, r = await fetch('/api/threads/' + id).catch(function () {})
  if (!r || !r.ok || id !== cur) return
  data = await r.json(); drawMiddle(); drawAgents()
}
async function pick(id, keepUnread) {
  cur = id; midKey = ''; sideKey = ''; quote = {}; orig = {}; imgs = {}
  $('.app').classList.toggle('solo', id === 'chief')
  if (id === 'chief') { drawChief(); drawList(); return }
  await loadDetail()
  if (!keepUnread && /^t/.test(id)) {
    fetch('/api/threads/' + id + '/seen', { method: 'POST', headers: { 'X-Fraim-Queue': '1' } }).catch(function () {})
    rows.forEach(function (r) { if (r.id === id) r.unread = false })
  }
  drawList()
}
async function post(url, body) {
  var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Fraim-Queue': '1' }, body: JSON.stringify(body) }).catch(function () {})
  if (!r || !r.ok) { toast('That did not work. Try again.'); return false }
  return true
}
async function markThread() {
  var id = cur, closing = !data.closed
  if (!await post('/api/threads/' + id + '/' + (closing ? 'dismiss' : 'restore'), {})) return
  sideKey = ''
  if (!closing) { toast('Put back in your inbox.'); await loadRows(); await loadDetail(); return }
  var list = shown(), at = list.findIndex(function (r) { return r.id === id }), next = list[at + 1] || list[at - 1]
  var e = $('#toast'); e.innerHTML = 'Removed. Mail like this stays out from now on.<button id="undo">Undo</button>'; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none' }, 7000)
  $('#undo').onclick = async function () { e.style.display = 'none'; if (await post('/api/threads/' + id + '/restore', {})) { await loadRows(); await pick(id) } }
  await loadRows()
  if (next && next.id !== id) await pick(next.id); else if (chief && chief.exists) await pick('chief')
}
function move(step) { var l = shown(), i = l.findIndex(function (r) { return r.id === cur }), n = l[i + step]; if (n) pick(n.id) }
$('#list').addEventListener('click', function (e) { var b = e.target.closest('.msg'); if (b) pick(b.dataset.id) })
$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; var f = shown()[0]; if (f && !shown().some(function (r) { return r.id === cur })) pick(f.id); else drawList() })
$('#message').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return
  var d = b.dataset
  if (d.go) { pick(d.go); return }
  if (d.quote) quote[d.quote] = !quote[d.quote]
  else if (d.orig) { var m = data.messages[+d.orig]; orig[d.orig] = !(orig[d.orig] === undefined ? m.designed : orig[d.orig]) }
  else if (d.img) imgs[d.img] = !imgs[d.img]
  else if (d.older) allOlder[data.id] = true
  else if (d.fold) opened[data.id + d.fold] = !opened[data.id + d.fold]
  else return
  drawMiddle(true)
})
$('#agents').addEventListener('click', async function (e) {
  if (e.target.id === 'nr') { markThread(); return }
  var b = e.target.closest('button[data-v]'); if (!b) return
  var draft = document.querySelector('textarea[data-draft="' + b.dataset.item + '"]')
  var body = { verdict: b.dataset.v, note: '' }
  if (draft) { body.text = draft.value; draft.blur() }
  if (await post('/api/items/' + b.dataset.item + '/decide', body)) { sideKey = ''; loadRows(); loadDetail() }
})
$('#message').addEventListener('keydown', async function (e) {
  if (e.target.id !== 'csay' || e.key !== 'Enter' || e.shiftKey) return
  e.preventDefault()
  var ta = e.target, text = ta.value.trim(); if (!text) return
  ta.value = ''
  chief.messages.push({ who: 'owner', text: text, time: new Date().toISOString(), app: true, refs: [] }); chief.typing = true; drawChief(); drawList()
  if (!await post('/api/chief/say', { text: text })) { ta.value = text; return }
  setTimeout(loadChief, 800)
})
$('#say').addEventListener('keydown', async function (e) {
  if (e.key !== 'Enter' || e.shiftKey) return
  e.preventDefault()
  var ta = e.target, text = ta.value.trim(); if (!text || !cur) return
  if (await post('/api/threads/' + cur + '/say', { text: text })) { ta.value = ''; loadDetail(); loadRows() }
})
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1) }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1) }
})
setInterval(function () { loadRows(); loadDetail() }, 5000)
loadRows()
</script>
