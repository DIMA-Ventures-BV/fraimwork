<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fraim queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='15' width='12' height='3' rx='1.5' fill='%23fff' opacity='.8'/%3E%3Crect x='8' y='21' width='8' height='3' rx='1.5' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #101113; --side: #0c0d0e; --panel: #141517; --hover: #1b1c1f; --active: #222327;
  --ink: #e6e7e9; --soft: #c2c4c9; --muted: #868a93; --faint: #565a62; --line: #1f2023; --line2: #2b2d31;
  --accent: #6f7bf0; --accent-bg: #1a1d36;
  --urgent: #f2711c; --high: #c2c4c9; --low: #565a62;
  --green: #4cc38a; --red: #f2555a; --yellow: #e2b33c; --blue: #6f7bf0; --gray: #868a93;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); font-feature-settings: "cv11"; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
svg { display: block; flex: none; }

.app { display: grid; grid-template-columns: 228px minmax(380px, 520px) minmax(0, 1fr); height: 100vh; }

/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 10px 8px 16px; }
.ws { display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; font-weight: 600; font-size: 13.5px; }
.ws .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: var(--soft); font-weight: 500; }
.nav button:hover, .nav a.back:hover { background: var(--hover); }
.nav a.back { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 6px; color: var(--soft); font-weight: 500; text-decoration: none; }
.nav button[aria-current="true"] { background: var(--active); color: var(--ink); }
.nav .c { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.nav .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 3px; }
.d-ok { background: var(--green); } .d-failed { background: var(--red); } .d-paused { border: 1.5px solid var(--yellow); } .d-never { border: 1.5px solid var(--faint); } .d-off { background: var(--faint); }
.nav .st { font-size: 11px; color: var(--faint); white-space: nowrap; }
.nav .st-failed { color: var(--red); } .nav .st-paused { color: var(--yellow); } .nav .st-running { color: var(--green); }
.nav .st + .c { margin-left: 6px; } .nav .nm + .st { margin-left: auto; }

/* list */
.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.bar { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 13px; font-weight: 600; margin: 0; }
.bar .c { color: var(--muted); }
.bar .grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line2); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--soft); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn[aria-pressed="true"] { background: var(--active); color: var(--ink); }
.btn kbd, .kbd { font: 500 11px var(--font); color: var(--muted); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; min-width: 17px; text-align: center; background: var(--panel); }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }

.brief { margin: 12px 12px 4px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; }
.brief-h { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.brief-h .av { width: 18px; height: 18px; border-radius: 50%; background: var(--urgent); color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 600; }
.brief-h b { color: var(--ink); font-weight: 500; }
.brief-t { white-space: pre-wrap; color: var(--soft); font-size: 13px; line-height: 1.55; }
.brief-t.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.brief-t.quiet { color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; margin-top: 4px; }

.ghead { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; background: var(--side); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); margin-top: -1px; font-weight: 500; color: var(--soft); position: sticky; top: 0; z-index: 1; }
.ghead .c { color: var(--muted); font-weight: 400; }
.row { display: grid; grid-template-columns: 16px 34px 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; height: 40px; padding: 0 14px 0 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--accent-bg); }
.row .id { color: var(--muted); font-size: 12px; }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .r { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.row.done .t { color: var(--muted); font-weight: 400; }
.label { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid var(--line2); border-radius: 999px; font-size: 11.5px; color: var(--soft); white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.label i { width: 6px; height: 6px; border-radius: 50%; background: var(--lc, var(--faint)); flex: none; }
.none { padding: 40px 20px; text-align: center; color: var(--muted); }

/* detail */
.detail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.crumb b { color: var(--ink); font-weight: 500; }
.doc { overflow-y: auto; flex: 1; min-height: 0; }
.doc-in { max-width: 760px; padding: 28px 36px 24px; margin: 0 auto; }
.doc h2 { font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -0.012em; margin: 0 0 14px; }
.props { display: grid; grid-template-columns: 110px 1fr; gap: 2px 12px; margin: 0 0 20px; padding: 0 0 16px; border-bottom: 1px solid var(--line); }
.props dt { color: var(--muted); height: 28px; display: flex; align-items: center; }
.props dd { margin: 0; min-height: 28px; display: flex; align-items: center; gap: 6px; color: var(--soft); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 0 8px; height: 24px; font-size: 12px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--ink); font-weight: 500; }
.desc { white-space: pre-wrap; font-size: 14px; line-height: 1.65; color: var(--soft); margin: 0 0 20px; }
.h3 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 22px 0 8px; }
.media { display: grid; gap: 10px; }
.media img, .media video { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; }
.att { display: flex; flex-direction: column; gap: 6px; }
.att a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--ink); font-weight: 500; overflow: hidden; }
.att a:hover { background: var(--hover); }
.att a span { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next { border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 6px; padding: 10px 12px; color: var(--soft); white-space: pre-wrap; }
.activity { color: var(--muted); display: flex; align-items: center; gap: 8px; }

.composer { flex: none; border-top: 1px solid var(--line); padding: 12px 16px 14px; }
.composer-in { max-width: 760px; margin: 0 auto; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
.composer-in:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.composer textarea { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; padding: 10px 12px 4px; min-height: 40px; max-height: 160px; }
.ctl { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 8px; }
.ctl .grow { flex: 1; }
.icon { width: 28px; height: 28px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.icon:hover { background: var(--hover); color: var(--ink); }
.icon.on { background: var(--red); color: #fff; }
.act { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; border: 1px solid var(--line2); background: var(--panel); color: var(--soft); }
.act:hover { background: var(--hover); }
.act kbd { font: 500 11px var(--font); opacity: .7; }
.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.act.primary:hover { filter: brightness(1.06); }
.act.danger { color: var(--red); }

.screen { margin: 0; background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--soft); white-space: pre-wrap; word-break: break-word; max-height: 56vh; overflow: auto; }
.ask { border: 1px solid color-mix(in srgb, var(--yellow) 45%, var(--line)); background: color-mix(in srgb, var(--yellow) 8%, var(--panel)); border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; color: var(--ink); white-space: pre-wrap; }
.cmd { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.cmd code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; color: var(--soft); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); animation: live 1.6s ease-out infinite; }
@keyframes live { to { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } }
.decide { border: 1px solid var(--line2); border-radius: 10px; background: var(--side); padding: 16px 18px; margin: 0 0 20px; }
.decide .q { font-size: 17px; line-height: 1.4; font-weight: 600; color: var(--ink); margin: 0 0 12px; }
.decide .adv { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0 0 8px; }
.decide .adv b { color: var(--advc, var(--accent)); font-weight: 600; }
.decide .fx { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 4px 0 12px; }
.decide .fx dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.decide .fx dd { margin: 0; color: var(--ink); }
@media (max-width: 560px) { .decide .fx { grid-template-columns: 1fr; gap: 2px; } .decide .fx dd { margin-bottom: 8px; } }
.decide ul { margin: 0; padding: 0 0 0 18px; color: var(--soft); }
.decide li { margin: 3px 0; }
details.more { margin: 0 0 20px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 500; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.more summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details.more[open] summary::before { transform: rotate(90deg); }
details.more .desc { margin-top: 10px; }
.act.advised { box-shadow: 0 0 0 2px var(--accent-bg), 0 0 0 3px var(--accent); }
.empty { margin: auto; text-align: center; padding: 40px; color: var(--muted); max-width: 360px; }
.empty svg { margin: 0 auto 12px; color: var(--faint); }
.empty b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; margin-bottom: 4px; }

.app.solo { grid-template-columns: 228px minmax(0, 1fr); }
.app.solo .list { display: none; }
.about { font-size: 14px; line-height: 1.6; color: var(--soft); margin: 0 0 18px; white-space: pre-wrap; }
.desc b { color: var(--ink); font-weight: 600; }
.boxed { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.boxed .row:last-child { border-bottom: 0; }
.steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
.steps li { display: grid; grid-template-columns: 14px 104px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps .v { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .w { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps .say { grid-column: 2 / -1; color: var(--ink); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.steps .live { align-self: center; }
details.run { border-bottom: 1px solid var(--line); }
details.run:last-child { border-bottom: 0; }
details.run summary { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; height: 34px; align-items: center; padding: 0 12px; cursor: pointer; list-style: none; }
details.run summary::-webkit-details-marker { display: none; }
details.run summary:hover { background: var(--hover); }
details.run .when { color: var(--muted); }
details.run .pv { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.run .desc { padding: 4px 12px 12px; margin: 0; }
.p-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 190px 170px 104px; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.p-row:last-child { border-bottom: 0; }
.p-row:hover { background: var(--hover); }
.p-a { width: 32px; height: 32px; border-radius: 50%; background: var(--active); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--soft); }
.p-m { min-width: 0; }
.p-m b { font-weight: 600; color: var(--ink); } .p-m small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.p-d { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-s { color: var(--soft); font-size: 12.5px; }
.p-t { display: flex; flex-wrap: wrap; gap: 4px; }
.p-t i { font-style: normal; font-size: 11.5px; color: var(--soft); border: 1px solid var(--line2); border-radius: 999px; padding: 0 7px; }
.p-w { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.p-w.st-running { color: var(--green); } .p-w.st-failed { color: var(--red); } .p-w.st-paused { color: var(--yellow); }
@media (max-width: 1000px) { .p-row { grid-template-columns: 32px minmax(0, 1fr) 104px; } .p-s, .p-t { display: none; } }
.quiet { color: var(--muted); }

.toast { position: fixed; right: 16px; bottom: 16px; background: var(--panel); color: var(--ink); border: 1px solid var(--line2); box-shadow: 0 8px 24px rgb(0 0 0 / .12); padding: 10px 12px; border-radius: 8px; display: none; z-index: 6; max-width: 360px; }
.flash { animation: flash .5s ease; }
@keyframes flash { from { background: var(--accent-bg); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

@media (max-width: 1100px) { .app { grid-template-columns: 200px 360px minmax(0, 1fr); } .row .r .label { display: none; } }
@media (max-width: 820px) {
  .app, .app.solo { grid-template-columns: 1fr; height: auto; }
  .side { display: none; }
  .list { border-right: 0; max-height: 50vh; }
  .doc-in { padding: 20px 16px; }
  .props { grid-template-columns: 90px 1fr; }
  .act kbd { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <section class="list">
    <div class="bar"><button class="icon" id="back" title="Back to the lead page (Esc)" aria-label="Back to the lead page" style="display:none"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4L6 8l4 4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1 id="view-title">Inbox</h1><span class="c" id="view-count"></span><span class="grow"></span><button class="btn" id="toggle" aria-pressed="false">Show decided</button></div>
    <div class="scroll" id="list"></div>
  </section>
  <main class="detail" id="detail"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
var agents = [], screenTimer = null, whoItem = null, memberTimer = null, memberData = null, memberKey = ''
var AGENT_STATUS = { working: 'Working', blocked: 'Waiting for you', idle: 'Idle', done: 'Done', error: 'Error', none: 'No Claude running in it' }
var AGENT_COLOR = { working: 'var(--green)', blocked: 'var(--yellow)', idle: 'var(--gray)', done: 'var(--accent)', error: 'var(--red)', none: 'var(--faint)' }
var all = [], items = [], teamData = { leads: [], automations: [], chief: null }, sel = 0, view = 'people', showDone = false, rec = null, briefOpen = false
var KIND = { review: 'Review', decision: 'Decision', idea: 'Idea', info: 'Info', failed: 'Failed' }
var KIND_COLOR = { review: 'var(--green)', decision: 'var(--blue)', idea: 'var(--yellow)', info: 'var(--gray)', failed: 'var(--red)' }
var WHEN = { 1: 'Today', 2: 'This week', 3: 'Later' }
var VERB = { approved: 'Approved', rejected: 'Sent back', dismissed: 'Skipped' }

function $(s) { return document.querySelector(s) }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#' }
function ago(iso) {
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000)
  if (m < 1) return 'now'; if (m < 60) return m + 'm'
  var h = Math.round(m / 60); if (h < 24) return h + 'h'
  return Math.round(h / 24) + 'd'
}
function since(local) {
  if (!local) return 'not yet'
  var d = new Date(local.replace(' ', 'T')), today = new Date(), hm = local.slice(11, 16)
  if (d.toDateString() === today.toDateString()) return 'today ' + hm
  var y = new Date(today); y.setDate(today.getDate() - 1)
  if (d.toDateString() === y.toDateString()) return 'yesterday ' + hm
  return local.slice(5, 10) + ' ' + hm
}
function owner(it) { return it.lead || (/^automation /.test(it.source) ? it.source.slice(11) : '') || it.source }
function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none' }, 3000) }

/* icons, drawn like an issue tracker: priority bars and status circles */
function prioIcon(p) {
  if (p === 1) return '<svg width="14" height="14" viewBox="0 0 16 16" aria-label="Today"><rect x="1" y="1" width="14" height="14" rx="3" fill="var(--urgent)"/><path d="M8 4v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="12" r="1.1" fill="#fff"/></svg>'
  var on = p === 2 ? 2 : 1
  return '<svg width="14" height="14" viewBox="0 0 16 16" aria-label="' + WHEN[p] + '">' + [0, 1, 2].map(function (i) {
    return '<rect x="' + (1.5 + i * 5) + '" y="' + (10 - i * 4) + '" width="3" height="' + (4 + i * 4) + '" rx="1" fill="' + (i < on ? 'var(--high)' : 'var(--line2)') + '"/>'
  }).join('') + '</svg>'
}
function statusIcon(it) {
  var c = KIND_COLOR[it.kind] || 'var(--gray)'
  if (it.state === 'approved') return '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--accent)"/><path d="M5 8.2l2 2 4-4.2" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'

function renderDetail() {
  var el = $('#detail'), it = items[sel]

    el.innerHTML = '<div class="empty">' + ICON.clear + '<b>' + (view === 'done' ? 'Nothing decided yet' : 'Inbox zero') + '</b>Leads, goals and automations put what needs you here. ' + esc(teamData.chief ? teamData.chief.title : 'The chief') + ' briefs you each morning.</div>'

      (effects.length ? '<dl class="fx">' + effects.map(function (e) { return '<dt>' + e[0] + '</dt><dd>' + esc(e[1]) + '</dd>' }).join('') + '</dl>' : '') +
      (it.why && it.why.length ? '<ul>' + it.why.map(function (w) { return '<li>' + esc(w) + '</li>' }).join('') + '</ul>' : '') +
      '</div>' : '') +
    (card && !it.if_yes && (it.on_approve || it.switch_on) ? '<div class="h3" style="margin-top:0">If you approve</div><div class="next" style="margin-bottom:20px">' + esc(it.on_approve || ('It starts running: ' + it.switch_on + '.')) + '</div>' : '') +
    '<dl class="props">' +
    '<dt>Status</dt><dd>' + statusIcon(it) + (open ? 'Waiting for you' : VERB[it.state] + ' ' + ago(it.decided) + ' ago') + '</dd>' +
    '<dt>Type</dt><dd><span class="label" style="--lc:' + KIND_COLOR[it.kind] + '"><i></i>' + esc(KIND[it.kind] || it.kind) + '</span></dd>' +
    '<dt>Needed</dt><dd>' + (open ? '<span class="seg" role="group" aria-label="When is it needed">' + [1, 2, 3].map(function (p) { return '<button data-p="' + p + '" aria-pressed="' + (it.priority === p) + '">' + prioIcon(p) + WHEN[p] + '</button>' }).join('') + '</span>' : prioIcon(it.priority) + WHEN[it.priority]) + '</dd>' +
    '<dt>From</dt><dd>' + esc(owner(it)) + (it.goal ? ' <span class="c">goal ' + esc(it.goal) + '</span>' : '') + '</dd>' +
    '<dt>Created</dt><dd>' + esc(new Date(it.created).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</dd>' +
    '</dl>' +
    (it.summary ? (card ? '<details class="more"><summary>Full report</summary><div class="desc">' + esc(it.summary) + '</div></details>' : '<div class="desc">' + esc(it.summary) + '</div>') : (card ? '' : '<div class="desc" style="color:var(--muted)">No description.</div>')) +
    (it.media.length ? '<div class="h3">Screenshots</div><div class="media">' + mediaHtml(it) + '</div>' : '') +
    (it.links.length ? '<div class="h3">Links</div><div class="att">' + it.links.map(linkHtml).join('') + '</div>' : '') +
    (it.on_approve && !card ? '<div class="h3">On approve, the server starts</div><div class="next">' + esc(it.on_approve) + '</div>' : '') +
    (open ? '' : '<div class="h3">Activity</div><div class="activity">' + statusIcon(it) + '<span>' + VERB[it.state] + (it.note ? ': ' + esc(it.note) : '') + (it.follow_up ? '. Started goal ' + esc(it.follow_up) + '.' : '') + '</span></div>') +
    (it.history && it.history.length ? '<details class="more" style="margin-top:20px"><summary>Earlier steps of this job (' + it.history.length + ')</summary>' + it.history.slice().reverse().map(stepHtml).join('') + '</details>' : '') +
    '</div></div>'

    html += '<div class="composer"><div class="composer-in"><textarea id="note" rows="1" placeholder="Leave a note for the agent. Sending back needs one."></textarea>' +
      '<div class="ctl"><button class="icon" id="mic" title="Dictate (v)" aria-label="Dictate a note">' + ICON.mic + '</button><span class="grow"></span>' +
      '<button class="act' + (it.advise === 'dismiss' ? ' advised' : '') + '" data-v="dismissed">Skip <kbd>D</kbd></button><button class="act danger' + (it.advise === 'reject' ? ' advised' : '') + '" data-v="rejected">Send back <kbd>R</kbd></button><button class="act primary' + (it.advise === 'approve' ? ' advised' : '') + '" data-v="approved">Approve <kbd>A</kbd></button></div></div></div>'

}
function stepHtml(s) {
  return '<div class="h3">' + esc(s.ask || s.title) + '</div><div class="activity">' + statusIcon(s) + '<span>' + esc(VERB[s.state] || 'Waited') + (s.note ? ': ' + esc(s.note) : '') + ' ' + ago(s.decided || s.created) + ' ago</span></div>' + (s.summary ? '<div class="desc">' + esc(s.summary) + '</div>' : '')
}
function agentIcon(a) {
  var c = AGENT_COLOR[a.status] || 'var(--faint)'
  if (a.status === 'working') return '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-dasharray="4 2.4"><animateTransform attributeName="transform" type="rotate" from="0 8 8" to="360 8 8" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="8" cy="8" r="2.4" fill="' + c + '"/></svg>'
  if (a.status === 'blocked') return '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="' + c + '"/><path d="M8 4.2v4.6" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.3" r="1" fill="#111"/></svg>'
  if (a.status === 'error') return '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="' + c + '" stroke-width="1.5"/><path d="M6 6l4 4M10 6l-4 4" stroke="' + c + '" stroke-width="1.5" stroke-linecap="round"/></svg>'
  return '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="' + c + '" stroke-width="1.5"/></svg>'

var KIND_LABEL = { main: 'WhatsApp chat', goal: 'Goal', session: 'Coding session', lead: 'Lead run', automation: 'Automation' }
function renderAgents() {
  $('#view-count').textContent = items.length || ''
  if (!items.length) { $('#list').innerHTML = '<div class="none">Nobody is working right now. Goals, coding sessions, lead runs and automations show up here while they run.</div>'; return }
  $('#list').innerHTML = items.map(function (a, i) {
    var sub = a.status === 'blocked' && a.question ? a.question : (a.cwd || KIND_LABEL[a.kind] || a.kind)
    return '<button class="row" data-i="' + i + '" aria-current="' + (i === sel) + '" style="grid-template-columns:16px minmax(0,1fr) auto">' + agentIcon(a) +
      '<span class="t">' + esc(a.name) + ' <span style="color:var(--muted);font-weight:400">' + esc(sub) + '</span></span>' +
      '<span class="r"><span class="label" style="--lc:' + (AGENT_COLOR[a.status] || 'var(--faint)') + '"><i></i>' + esc(AGENT_STATUS[a.status] || a.status) + '</span></span></button>'
  }).join('')
}
function renderAgent() {
  var el = $('#detail'), a = items[sel]
  clearInterval(screenTimer)
  if (!a) { el.innerHTML = '<div class="empty">' + ICON.clear + '<b>All quiet</b>No agent is running right now.</div>'; return }
  var canSend = /^[gs]\d+$/.test(a.name)
  var html = '<div class="bar"><div class="crumb">Active<span>/</span><b>' + esc(a.name) + '</b></div><span class="grow"></span><span class="c">' + (sel + 1) + ' / ' + items.length + '</span><button class="icon" id="prev" title="Previous (k)" aria-label="Previous">' + ICON.up + '</button><button class="icon" id="next" title="Next (j)" aria-label="Next">' + ICON.down + '</button></div>' +
    '<div class="doc"><div class="doc-in"><h2>' + esc(a.name) + '</h2><dl class="props">' +
    '<dt>Status</dt><dd>' + agentIcon(a) + esc(AGENT_STATUS[a.status] || a.status) + '</dd>' +
    '<dt>Type</dt><dd>' + esc(KIND_LABEL[a.kind] || a.kind) + '</dd>' +
    (a.cwd ? '<dt>Folder</dt><dd>' + esc(a.cwd) + '</dd>' : '') +
    (a.turn ? '<dt>Since</dt><dd>' + esc(/T/.test(a.turn) ? ago(a.turn) + ' ago' : a.turn) + '</dd>' : '') +
    (a.kind === 'session' ? '<dt>Take over</dt><dd class="cmd"><code>fraim shell ' + esc(a.name) + '</code><button class="btn" id="copy">Copy</button></dd>' : '') +
    '</dl>' + (a.status === 'blocked' && a.question ? '<div class="ask">' + esc(a.question) + '</div>' : '') +
    (a.live || /^g\d+$/.test(a.name) ? '<div class="h3">Screen</div><pre class="screen" id="screen">Loading...</pre>' : '<div class="desc" style="color:var(--muted)">This run works in the background. Its answer lands in the inbox or the run history when it is done.</div>') +
    '</div></div>'

async function loadScreen(name) {
  try {
    var r = await fetch('/api/active/' + encodeURIComponent(name) + '/screen'); var s = $('#screen'); if (!s || !r.ok) return
    var d = await r.json(), atEnd = s.scrollTop + s.clientHeight >= s.scrollHeight - 20
    s.textContent = d.text || '(nothing on the screen yet)'
    if (atEnd) s.scrollTop = s.scrollHeight
  } catch (e) {}
}
async function sendToAgent() {
  var a = items[sel], ta = $('#note'); if (!a || !ta || !ta.value.trim()) return
  var r = await fetch('/api/active/' + encodeURIComponent(a.name) + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Fraim-Queue': '1' }, body: JSON.stringify({ text: ta.value.trim() }) })

  if (!r.ok) { toast(out.error || 'That did not work.'); return }

function select(i) {
  if (sel < 0 || i < 0 || i >= items.length || i === sel) return
  if (view === 'active') { sel = i; renderAgents(); renderAgent(); return }
  sel = i; renderList(); renderDetail()
  var el = document.querySelector('.row[aria-current="true"]'); if (el) el.scrollIntoView({ block: 'nearest' })
}
async function post(id, what, body) {
  var res = await fetch('/api/items/' + id + '/' + what, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Fraim-Queue': '1' }, body: JSON.stringify(body) })
  var out = await res.json()
  if (!res.ok) { toast(out.error || 'That did not work. Try again.'); return null }
  return out
}
async function decide(verdict) {
  var it = items[sel]; if (!it || it.state !== 'open') return
  var ta = $('#note'), note = ta ? ta.value.trim() : ''
  if (verdict === 'rejected' && !note) { toast('Write why first, so the agent knows what to change.'); if (ta) ta.focus(); return }
  var out = await post(it.id, 'decide', { verdict: verdict, note: note })
  if (!out) return
  toast(it.id.toUpperCase() + ' ' + VERB[verdict].toLowerCase() + (out.follow_up ? '. Started goal ' + out.follow_up + '.' : '.'))
  await load()
  var d = $('#detail'); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash')
}
async function setPrio(p) { var it = items[sel]; if (it && await post(it.id, 'priority', { priority: p })) load(it.id) }
function dictate() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, ta = $('#note'), mic = $('#mic')
  if (!ta) return
  if (!SR) { toast('This browser cannot dictate. Use the dictation key of your keyboard.'); ta.focus(); return }
  if (rec) { rec.stop(); return }
  rec = new SR(); rec.lang = navigator.language || 'nl-NL'; rec.continuous = true; rec.interimResults = true
  var start = ta.value
  rec.onresult = function (e) { ta.value = (start ? start + ' ' : '') + Array.from(e.results).map(function (r) { return r[0].transcript }).join(' ') }

  if (mic) mic.classList.add('on'); rec.start()
}
function setView(v) { view = v; sel = 0; whoItem = null; load() }
function backToMember() { whoItem = null; sel = 0; load() }
$('#side').addEventListener('click', function (e) { var b = e.target.closest('button[data-view]'); if (b) setView(b.dataset.view) })
$('#list').addEventListener('click', function (e) {
  if (e.target.id === 'more') { briefOpen = !briefOpen; renderList(); return }
  var b = e.target.closest('.row'); if (b) select(+b.dataset.i)
})
$('#detail').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return
  if (b.classList.contains('row') && sel < 0) { whoItem = items[+b.dataset.i].id; load(whoItem); return }
  if (b.dataset.who) { setView('who:' + b.dataset.who); return }
  if (b.dataset.v) decide(b.dataset.v); else if (b.dataset.p) setPrio(+b.dataset.p)
  else if (b.id === 'send') sendToAgent()
  else if (b.id === 'copy') { var c = b.previousElementSibling; if (navigator.clipboard && c) navigator.clipboard.writeText(c.textContent).then(function () { toast('Copied. Paste it in a terminal.') }) }
  else if (b.id === 'mic') dictate(); else if (b.id === 'prev') select(sel - 1); else if (b.id === 'next') select(sel + 1)
})
$('#toggle').onclick = function () { showDone = !showDone; load() }
$('#back').onclick = backToMember
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') e.target.blur()
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (view === 'active') sendToAgent(); else decide('rejected') }
    return
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return
  var k = e.key
  if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); select(sel + 1) }
  else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); select(sel - 1) }
  else if (k === 'a') decide('approved')
  else if (k === 'r') { var ta = $('#note'); if (ta && !ta.value.trim()) { e.preventDefault(); ta.focus(); toast('Write why, then press Ctrl+Enter.') } else decide('rejected') }
  else if (k === 'd') decide('dismissed')
  else if (k === 'v') { e.preventDefault(); dictate() }
  else if (k === 'c' || k === 'n') { e.preventDefault(); var t = $('#note'); if (t) t.focus() }
  else if (k === 'g') location.href = '/'
  else if (k === 'Escape' && whoItem) backToMember()
  else if (k === 'Escape' && view !== 'people') setView('people')
  else if (k === '1' || k === '2' || k === '3') setPrio(+k)

setInterval(function () { if (!document.activeElement || document.activeElement.tagName !== 'TEXTAREA') { if (!rec) { var it = items[sel]; load(it && it.id) } } }, 30000)
load()
</script>
