# Test-only additions for tests/secrets.sh, layered on compose.yaml.
services:
  secrets:
    environment:
      SECRETS_ALLOW_HTTP: "1"
  # A fake API: answers with the auth headers it received.
  echo:
    image: caddy:2.11.1-alpine
    command:
      - sh
      - -c
      - |
        printf ':80 {\n\trespond "auth=[{header.Authorization}] key=[{header.x-api-key}] host=[{host}] path=[{path}]"\n}\n' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    networks: [secrets-out]
  # Stands in for Claude's workspace (on the secrets network).
  client:
    image: caddy:2.11.1-alpine
    command: [sleep, infinity]
    networks: [secrets]
  # Stands in for the browser (only on the fraim network).
  outsider:
    image: caddy:2.11.1-alpine
    command: [sleep, infinity]
    networks: [fraim]
