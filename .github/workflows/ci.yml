name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HADOLINT_VERSION: v2.12.0
      ACTIONLINT_VERSION: 1.7.7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends bats shellcheck jq
          sudo curl -fsSLo /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint

      - name: Lint
        run: make lint

      - name: Unit tests (fraim CLI and config layer)
        run: make test-unit

      - name: Unit tests (WhatsApp rules)
        run: make test-node
